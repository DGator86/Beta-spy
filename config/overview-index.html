<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPY Trading — Overview</title>
<style>
  :root{--bg:#0b0e14;--card:#131824;--line:#1f2637;--text:#dbe2f0;--dim:#7d89a3;--pos:#3ecf8e;--neg:#ff6b6b;--warn:#ffb454}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px;max-width:1100px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  h1{font-size:20px;letter-spacing:.5px}
  header nav a{color:#6ea8fe;text-decoration:none;margin-left:16px;font-size:13px}
  header nav a:hover{text-decoration:underline}
  .updated{color:var(--dim);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .badge{font-size:11px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);letter-spacing:.5px}
  .badge.ok{color:var(--pos);border-color:var(--pos)}
  .badge.bad{color:var(--neg);border-color:var(--neg)}
  .badge.warn{color:var(--warn);border-color:var(--warn)}
  .kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
  .kv label{color:var(--dim)}
  .kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  .pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--dim)}
  .services{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:4px}
  .svc{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
  .dot{width:8px;height:8px;border-radius:99px;background:var(--neg);flex:none}
  .dot.up{background:var(--pos)}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--dim);overflow-x:auto;margin-top:10px;white-space:pre-wrap}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  .wide{grid-column:1/-1}
  footer{margin-top:16px;color:var(--dim);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>SPY Trading Overview</h1>
  <nav>
    <a href="#" id="alphaLink" target="_blank">Alpha-spy dashboard →</a>
    <a href="#" id="betaLink" target="_blank">Beta-spy dashboard →</a>
  </nav>
  <span class="updated" id="updated">loading…</span>
</header>

<div class="grid">
  <section class="card">
    <h2>Beta-spy <span class="badge" id="betaBadge">…</span></h2>
    <div class="kv">
      <label>Decision</label><b id="betaAction">—</b>
      <label>Gates passing</label><b id="betaGates">—</b>
      <label>Risk multiplier</label><b id="betaRiskMult">—</b>
      <label>Equity</label><b id="betaEquity">—</b>
      <label>Day P&amp;L</label><b id="betaDayPnl">—</b>
      <label>Total realized</label><b id="betaTotalPnl">—</b>
      <label>Win rate</label><b id="betaWinRate">—</b>
      <label>Open positions</label><b id="betaOpen">—</b>
      <label>Risk budget / trade</label><b id="betaSizeMult">—</b>
      <label>Loss breaker</label><b id="betaBreaker">—</b>
    </div>
    <table id="betaPositions" style="display:none">
      <thead><tr><th>Strategy</th><th>Dir</th><th>Status</th><th>P&amp;L</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="card">
    <h2>Alpha-spy <span class="badge" id="alphaBadge">…</span></h2>
    <div class="kv">
      <label>SPY</label><b id="alphaPrice">—</b>
      <label>Session</label><b id="alphaSession">—</b>
      <label>Decision</label><b id="alphaAction">—</b>
      <label>Trust score</label><b id="alphaTrust">—</b>
      <label>P(up) 15m</label><b id="alphaProb">—</b>
      <label>Account equity</label><b id="alphaEquity">—</b>
      <label>Day P&amp;L</label><b id="alphaDayPnl">—</b>
      <label>Position open</label><b id="alphaPosition">—</b>
    </div>
  </section>

  <section class="card wide">
    <h2>Operations <span class="badge" id="opsBadge">…</span></h2>
    <div class="services" id="services"></div>
    <div class="kv" style="margin-top:12px">
      <label>Next backtest</label><b id="nextBacktest">—</b>
      <label>Next Beta backup</label><b id="nextBetaBackup">—</b>
      <label>Next Alpha backup</label><b id="nextAlphaBackup">—</b>
      <label>Latest backtest report</label><b id="latestReport">—</b>
      <label>Disk free</label><b id="diskFree">—</b>
      <label>Memory available</label><b id="memAvail">—</b>
    </div>
    <pre id="watchdog">watchdog: —</pre>
  </section>
</div>

<footer>Auto-refreshes every 15 seconds (ops data every minute). Full dashboards are linked in the header.</footer>

<script>
const $=id=>document.getElementById(id);
$('alphaLink').href=location.protocol+'//'+location.hostname+':8081/';
$('betaLink').href=location.protocol+'//'+location.hostname+':8082/';
const money=v=>(v==null||isNaN(v))?'—':(v<0?'-$':'$')+Math.abs(v).toFixed(2);
const tone=(el,v)=>{el.classList.remove('pos','neg');if(v>0)el.classList.add('pos');if(v<0)el.classList.add('neg')};
const badge=(el,label,ok)=>{el.textContent=label;el.className='badge '+(ok===true?'ok':ok===false?'bad':'warn')};
const when=iso=>{if(!iso||iso==='unknown')return '—';const d=new Date(iso);return isNaN(d)?iso:d.toLocaleString(undefined,{weekday:'short',hour:'2-digit',minute:'2-digit'})};

async function pull(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(url+' '+r.status);return r.json()}

async function refreshBeta(){
  try{
    const s=await pull('/api/beta/state');
    badge($('betaBadge'),s.status||'?',s.status==='LIVE');
    const d=(s.snapshot||{}).decision;
    if(d){
      $('betaAction').textContent=d.action+(d.direction&&d.direction!=='NONE'?' · '+d.direction:'');
      const g=d.gates||{};const passing=Object.values(g).filter(Boolean).length;
      $('betaGates').textContent=passing+' / '+Object.keys(g).length;
      $('betaRiskMult').textContent=(d.risk_multiplier??1).toFixed(2)+'×';
    }else{
      $('betaAction').textContent='no snapshot (tape quiet)';
      $('betaGates').textContent='—';$('betaRiskMult').textContent='—';
    }
    const l=s.ledger;
    if(l){
      $('betaEquity').textContent=money(l.equity);
      $('betaDayPnl').textContent=money(l.day_realized_pnl_dollars);tone($('betaDayPnl'),l.day_realized_pnl_dollars);
      $('betaTotalPnl').textContent=money(l.realized_pnl_dollars);tone($('betaTotalPnl'),l.realized_pnl_dollars);
      $('betaWinRate').textContent=l.closed_count?Math.round(l.win_rate*100)+'% of '+l.closed_count:'no closed trades yet';
      $('betaOpen').textContent=l.open_count||0;
      $('betaSizeMult').textContent=l.risk_budget_dollars!=null?money(l.risk_budget_dollars):'—';
      $('betaBreaker').textContent=l.breaker_tripped?'TRIPPED':'armed';tone($('betaBreaker'),l.breaker_tripped?-1:1);
      const rows=(l.open_positions||[]).map(p=>`<tr><td>${p.strategy}</td><td>${p.direction}</td><td>${p.status}×${p.contracts}</td><td class="${(p.unrealized_pnl_dollars||0)>=0?'pos':'neg'}">${money(p.unrealized_pnl_dollars)}</td></tr>`)
        .concat((l.recent_closed||[]).slice(0,4).map(p=>`<tr class="dim"><td>${p.strategy}</td><td>${p.direction}</td><td>${p.exit_reason||'CLOSED'}</td><td class="${(p.realized_pnl_dollars||0)>=0?'pos':'neg'}">${money(p.realized_pnl_dollars)}</td></tr>`));
      const t=$('betaPositions');t.style.display=rows.length?'table':'none';t.tBodies[0].innerHTML=rows.join('');
    }
  }catch(e){badge($('betaBadge'),'UNREACHABLE',false)}
}

async function refreshAlpha(){
  try{
    const s=await pull('/api/alpha/v1/state');
    const health=((s.health||{}).state||'?');
    badge($('alphaBadge'),health,health==='GREEN'?true:health==='RED'?false:null);
    const m=s.market||{};
    $('alphaPrice').textContent=m.bid&&m.ask?('$'+((m.bid+m.ask)/2).toFixed(2)+(m.change_pct!=null?' ('+(m.change_pct>0?'+':'')+m.change_pct.toFixed(2)+'%)':'')):'—';
    const sess=s.session||{};
    $('alphaSession').textContent=(sess.market_open?'OPEN':'closed')+' · entry '+(sess.entry_window||'?').toLowerCase();
    $('alphaAction').textContent=((s.decision||{}).action)||'—';
    $('alphaTrust').textContent=((s.health||{}).trust_score??'—');
    const h15=((s.forecast_horizons||{})['15m'])||{};
    $('alphaProb').textContent=h15.probability_up!=null?(h15.probability_up*100).toFixed(1)+'%':'—';
    const a=s.account||{};
    $('alphaEquity').textContent=money(a.equity);
    $('alphaDayPnl').textContent=money(a.daily_pnl);tone($('alphaDayPnl'),a.daily_pnl);
    $('alphaPosition').textContent=((s.position||{}).open)?'YES':'no';
  }catch(e){badge($('alphaBadge'),'UNREACHABLE',false)}
}

async function refreshOps(){
  try{
    const s=await pull('/status.json');
    badge($('opsBadge'),s.all_services_active?'ALL SYSTEMS GO':'ATTENTION',s.all_services_active);
    $('services').innerHTML=Object.entries(s.services||{}).map(([unit,state])=>
      `<span class="svc"><span class="dot ${state==='active'?'up':''}"></span>${unit}</span>`).join('');
    const t=s.timers_next||{};
    $('nextBacktest').textContent=when(t['beta-spy-backtest.timer']);
    $('nextBetaBackup').textContent=when(t['beta-spy-backup.timer']);
    $('nextAlphaBackup').textContent=when(t['alpha-spy-backup.timer']);
    $('latestReport').textContent=s.latest_backtest_report||'—';
    $('diskFree').textContent=s.disk_free_gb!=null?s.disk_free_gb+' GB':'—';
    $('memAvail').textContent=s.memory_available_mb!=null?s.memory_available_mb+' / '+s.memory_total_mb+' MB':'—';
    $('watchdog').textContent=(s.watchdog_tail||[]).join('\n')||'watchdog: no log yet';
  }catch(e){badge($('opsBadge'),'STATUS UNAVAILABLE',false)}
}

async function tick(){
  await Promise.allSettled([refreshBeta(),refreshAlpha()]);
  $('updated').textContent='updated '+new Date().toLocaleTimeString();
}
tick();refreshOps();
setInterval(tick,15000);
setInterval(refreshOps,60000);
</script>
</body>
</html>
