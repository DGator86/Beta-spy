# SPY trading external access: overview on 80, full dashboards on 8081/8082.
# Everything sits behind one HTTP basic-auth account (htpasswd below); the
# services themselves stay bound to 127.0.0.1 and are only reachable through
# these proxies or an SSH tunnel.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;

    auth_basic "SPY Trading";
    auth_basic_user_file /etc/nginx/.spy-htpasswd;

    root /var/www/spy-overview;
    index index.html;

    location = /status.json {
        add_header Cache-Control "no-store";
    }

    # Live trading data for the overview page.
    location /api/beta/ {
        proxy_pass http://127.0.0.1:8790/api/;
        proxy_read_timeout 15s;
    }
    location /api/alpha/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_read_timeout 15s;
    }
}

# Full Alpha-spy dashboard (websocket-capable).
server {
    listen 8081;
    server_name _;

    auth_basic "SPY Trading";
    auth_basic_user_file /etc/nginx/.spy-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# Full Beta-spy dashboard.
server {
    listen 8082;
    server_name _;

    auth_basic "SPY Trading";
    auth_basic_user_file /etc/nginx/.spy-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
