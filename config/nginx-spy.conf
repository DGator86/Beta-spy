# SPY trading external access: overview on 80, full dashboards on 8081/8082.
# The dashboards and raw engine APIs stay behind HTTP basic auth.  The only
# unauthenticated surface is /chatgpt/, which contains a scrubbed, read-only,
# random-path market-state document generated by Delta.  It contains no broker
# credentials, account identifiers, order endpoints or execution capability.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80 default_server;
    server_name _;

    auth_basic "SPY Trading";
    auth_basic_user_file /etc/nginx/.spy-htpasswd;

    root /var/www/spy-overview;
    index index.html;

    location = /status.json {
        add_header Cache-Control "no-store";
    }

    # ChatGPT bridge.  The filename beneath this prefix is generated randomly
    # on the VPS and published separately; directory listing is never enabled.
    # Everything outside this exact prefix inherits the dashboard's basic auth.
    location ^~ /chatgpt/ {
        auth_basic off;
        default_type application/json;
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Live trading data for the overview page remains authenticated.
    location /api/beta/ {
        proxy_pass http://127.0.0.1:8790/api/;
        proxy_read_timeout 15s;
    }
    location /api/alpha/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_read_timeout 15s;
    }
}

# Full Alpha-spy dashboard (websocket-capable).
server {
    listen 8081;
    server_name _;

    auth_basic "SPY Trading";
    auth_basic_user_file /etc/nginx/.spy-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}

# Full Beta-spy dashboard.
server {
    listen 8082;
    server_name _;

    auth_basic "SPY Trading";
    auth_basic_user_file /etc/nginx/.spy-htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
