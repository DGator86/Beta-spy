name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile core
        run: python -m compileall -q src tests
      - name: Validate SPY Command assets
        shell: bash
        run: |
          python -m py_compile \
            scripts/spy-overview-status.py \
            scripts/spy-overview-delta.py \
            scripts/spy-overview-delta-v2.py \
            scripts/spy-overview-live.py
          bash -n scripts/deploy-spy-overview.sh scripts/spy-tunnel-url.sh
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('config/overview-index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not match:
              raise SystemExit('overview-index.html has no inline script')
          Path('/tmp/spy-command.js').write_text(match.group(1), encoding='utf-8')

          required = ['command', 'alpha', 'beta', 'performance', 'system', 'chart', 'heat']
          missing = [item for item in required if f'id="{item}"' not in html]
          if missing:
              raise SystemExit(f'missing dashboard IDs: {missing}')

          nginx = Path('config/nginx-spy.conf').read_text(encoding='utf-8')
          required_nginx = ['location ^~ /chatgpt/', 'auth_basic off', 'try_files $uri =404']
          missing_nginx = [item for item in required_nginx if item not in nginx]
          if missing_nginx:
              raise SystemExit(f'missing ChatGPT nginx protections: {missing_nginx}')
          PY
          node --check /tmp/spy-command.js
      - name: Delta tests
        run: pytest -q tests/test_spy_overview_delta.py tests/test_spy_overview_delta_v2.py tests/test_spy_overview_live.py
      - name: Tests
        run: pytest
