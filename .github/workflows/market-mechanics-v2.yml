name: Market Mechanics V2 Research

on:
  pull_request:
    paths:
      - 'src/beta_spy/mechanics.py'
      - 'src/beta_spy/mechanics_v2.py'
      - 'tests/test_mechanics.py'
      - 'tests/test_mechanics_v2.py'
      - 'scripts/market_mechanics_research.py'
      - 'scripts/market_mechanics_v2_research.py'
      - 'docs/MARKET_MECHANICS_*.md'
      - '.github/workflows/market-mechanics-v2.yml'

permissions:
  contents: read

jobs:
  mechanics-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile research modules
        run: |
          python -m py_compile src/beta_spy/mechanics.py
          python -m py_compile src/beta_spy/mechanics_v2.py
          python -m py_compile scripts/market_mechanics_research.py
          python -m py_compile scripts/market_mechanics_v2_research.py
      - name: Run V1 and V2 mechanics tests
        run: pytest -q tests/test_mechanics.py tests/test_mechanics_v2.py
