[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beta-spy"
version = "0.1.0"
description = "SPY constituent indicator, breadth, order-flow, forecast, replay, and options-expression workstation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "pandas>=2.1,<4",
  "openpyxl>=3.1,<4",
  "lxml>=5,<7",
  "httpx>=0.27,<1",
  "websockets>=13,<17",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
beta-spy = "beta_spy.cli:main"
beta-spy-v2 = "beta_spy.v2_runtime:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"beta_spy" = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
